x-model-env: &model-env
  MODEL_URL: ${MODEL_URL:-https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf}
  MODEL_FILE: ${MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}
  MODEL_SHA256: ${MODEL_SHA256:-}

services:
  # 1) Téléchargement du modèle LLM Qwen 2.5
  model-downloader:
    image: curlimages/curl:8.10.1
    user: "0:0"
    environment: *model-env
    volumes:
      - llm_models:/models
      - ./scripts/download_llm_model.sh:/download_model.sh:ro
    entrypoint: ["/bin/sh", "/download_model.sh"]
    restart: "no"

  # 2) Serveur d'inférence LLM local llama.cpp
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: lio_llm_server
    depends_on:
      model-downloader:
        condition: service_completed_successfully
    volumes:
      - llm_models:/models:ro
    command:
      - "-m"
      - "/models/${MODEL_FILE:-qwen2.5-1.5b-instruct-q4_k_m.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${LLM_CTX_SIZE:-8192}"
      - "-t"
      - "${LLM_THREADS:-4}"
      - "-np"
      - "1"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # 3) Serveur Backend FastAPI + WhisperAI
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lio_backend_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/lio.db
      - WHISPER_MODEL_PATH=/app/models/ggml-base-q5_1.bin
      - WHISPER_THREADS=4
      - LLM_BASE_URL=http://llm:8080
      - TZ=Europe/Paris
    volumes:
      - ./data:/app/data
    depends_on:
      llm:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  llm_models:
